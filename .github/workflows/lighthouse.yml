name: Performance Budget
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lhci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            .npmrc

      - run: npm ci --no-audit
      - run: npm install -g @lhci/cli

      - name: Run Lighthouse CI
        run: |
          # roda o autorun apontando ao seu .lighthouserc.cjs
          lhci autorun --config ./.lighthouserc.cjs
