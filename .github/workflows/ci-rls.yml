name: CI rls

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.19.0]

    name: CI on Node ${{ matrix.node-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Validate Node.js version from .nvmrc
        run: |
          REQUIRED_NODE=$(cat .nvmrc)
          CURRENT_NODE=$(node -v | sed 's/v//')
          if [ "$CURRENT_NODE" != "$REQUIRED_NODE" ]; then
            echo "⚠️ CI está rodando com Node $CURRENT_NODE, mas .nvmrc exige $REQUIRED_NODE"
          fi

      - name: Install deps & Playwright browsers
        run: npm run setup

      - name: Run npm audit (produção)
        run: npm audit --production --audit-level=critical

      - name: Run all tests
        run: npm test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
