# .github/workflows/ci-main.yml
name: CI on main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: [20.19.0]

    name: E2E on Node ${{ matrix.node-version }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Validate package.json
        run: npx jsonlint@1.6.3 package.json

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .npmrc

      - name: Validate Node.js version from .nvmrc
        run: |
          REQUIRED_NODE=$(cat .nvmrc)
          CURRENT_NODE=$(node -v | sed 's/v//')
          if [ "$CURRENT_NODE" != "$REQUIRED_NODE" ]; then
            echo "⚠️ CI está rodando com Node $CURRENT_NODE, mas .nvmrc exige $REQUIRED_NODE"
          fi

      - name: Install dependencies (omit optional deps)
        run: npm ci --omit=optional

      - name: Security audit (fail on critical)
        run: npm audit --audit-level=critical

      - name: Patch Rollup native module
        run: npm install @rollup/rollup-linux-x64-gnu --no-save

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 5
