# .github/workflows/codeql-analysis.yml

name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'

permissions:
  actions: read
  security-events: write

jobs:
  analyze:
    name: Analyze code with CodeQL
    runs-on: ubuntu-latest

    steps:
      # 1) DEBUG: confirme qual slug o runner está vendo
      - name: Debug GITHUB_REPOSITORY
        run: echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"

      # 2) Checkout sem “repository:” customizado — usa o repo que disparou o workflow
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3.30.5
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3.30.5

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3.30.5
