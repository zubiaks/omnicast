# .github/workflows/codeql-analysis.yml

name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0'

permissions:
  actions: read
  security-events: write

jobs:
  analyze:
    name: Analyze code with CodeQL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # Remova completamente qualquer 'with: repository:' aqui,
        # para garantir que o Action use o repositório que disparou o workflow.

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3.30.5
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3.30.5

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3.30.5
