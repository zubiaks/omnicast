<!DOCTYPE html>
<html lang="pt" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Você está Offline – OmniCast</title>

  <!-- PWA manifest + ícone -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/assets/icons/icon-192.png" sizes="192x192" type="image/png" />
  <meta name="theme-color" content="#222831" />

  <!-- CSS global e offline -->
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/layout.css" />
  <link rel="stylesheet" href="/assets/css/offline.css" />
</head>
<body class="offline-page">

  <header class="site-header" role="banner">
    <div class="logo" aria-label="OmniCast">OmniCast</div>
  </header>

  <main class="offline-content" role="alertdialog" aria-labelledby="offline-heading" aria-modal="true">
    <h1 id="offline-heading">Você está Offline</h1>
    <p>Parece que sua conexão caiu. Recarregue quando estiver online.</p>
    <button
      id="reload-btn"
      class="btn-primary"
      role="button"
      aria-label="Recarregar a página"
      tabindex="0"
    >
      Recarregar
    </button>
  </main>

  <footer class="site-footer" role="contentinfo">
    <p>© 2025 OmniCast. Todos os direitos reservados.</p>
  </footer>

  <!-- Mantém o SW ativo mesmo nesta página -->
  <script type="module" src="/js/sw-register.js"></script>

  <!-- Telemetria e lógica de recarga -->
  <script type="module">
    import analytics from '/js/utils/analytics.js'

    // Log de exibição da página offline
    analytics.track('page.offline')

    const btn = document.getElementById('reload-btn')

    // Função de reload com telemetria
    function reloadPage() {
      analytics.track('offline.reload')
      window.location.reload()
    }

    // Clique e keyboard support
    btn.addEventListener('click', reloadPage)
    btn.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault()
        reloadPage()
      }
    })
  </script>
</body>
</html>
