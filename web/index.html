<!-- web/index.html -->
<!DOCTYPE html>
<html lang="pt-BR" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniCast</title>

  <!-- PWA manifest + ícones -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#222831" />
  <link rel="icon" href="/assets/icons/icon-192.png" sizes="192x192" type="image/png" />

  <!-- CSS global -->
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/layout.css" />
  <link rel="stylesheet" href="/assets/css/theme.css" />

  <!-- Utilitários de UI -->
  <link rel="stylesheet" href="/assets/css/spinner.css" />
  <link rel="stylesheet" href="/assets/css/toast.css" />

  <!-- Classe utilitária para ocultar elementos -->
  <style>
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header class="site-header" role="banner">
    <div class="logo">
      <a href="#/home" aria-label="Início OmniCast">OmniCast</a>
    </div>
    <nav class="site-nav" role="navigation" aria-label="Menu principal">
      <ul>
        <li><a href="#/home">Home</a></li>
        <li><a href="#/iptv">IPTV</a></li>
        <li><a href="#/vod">VOD</a></li>
        <li><a href="#/radio">Rádio</a></li>
        <li><a href="#/webcams">Webcams</a></li>
      </ul>
      <div class="auth-controls">
        <a id="login-link"  href="#/login">Login</a>
        <a id="signup-link" href="#/signup">Cadastrar</a>
        <button id="logout-btn" class="hidden">Sair</button>
      </div>
    </nav>
  </header>

  <main id="main-content" role="main" tabindex="-1">
    <!-- Conteúdo injetado pelo router -->
  </main>

  <footer class="site-footer" role="contentinfo">
    <p>© 2025 OmniCast. Todos os direitos reservados.</p>
  </footer>

  <!-- Bundle principal (main.js agora contém o registo do SW em produção) -->
  <script type="module" src="/js/main.js"></script>
</body>
</html>
